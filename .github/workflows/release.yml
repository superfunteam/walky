name: Android APK release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0)
        required: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Set Android release signing secrets before creating a release.'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/walky-release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/walky-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: VERSION_NAME="${RELEASE_TAG#v}" ./gradlew assembleRelease lintRelease
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk walky.apk
          sha256sum walky.apk > walky.apk.sha256
          gh release create "$RELEASE_TAG" walky.apk walky.apk.sha256 --verify-tag --title "Walky ${RELEASE_TAG#v}" --notes-file docs/release-notes.md
